<div class="config-section"><div class="config-section-title"><i class="fas fa-star"></i> 可用技能</div><div class="item-list" id="skillList"></div></div><div class="config-section" style="border-top:1px solid var(--border-color);padding-top:20px;"><div class="config-section-title"><i class="fas fa-plus-circle"></i> 添加技能 (支持 .md 文件)</div><div class="config-group"><label>技能名称</label><input type="text" id="skillNameInput" placeholder="例如: 代码审查助手"></div><div class="config-group"><label>技能描述</label><input type="text" id="skillDescInput" placeholder="技能功能的简要描述"></div><div class="config-group"><label>上传 Markdown 文件</label><div class="skill-file-upload"><input type="file" id="skillFileInput" accept=".md" class="skill-file-input" onchange="skillFileChanged(this)"><label for="skillFileInput" class="skill-file-btn"><i class="fas fa-folder-open"></i> 选择 .md 文件</label><span id="skillFileName" class="skill-file-name">未选择文件</span></div><button onclick="uploadSkillMD()" class="btn-primary" style="width:auto;padding:8px 20px;margin-top:8px;"><i class="fas fa-upload"></i> 上传</button></div></div>
