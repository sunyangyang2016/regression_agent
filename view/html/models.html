<div class="config-section"><div class="config-section-title"><i class="fas fa-check-circle" style="color:var(--accent-success);"></i> 当前使用的模型</div><div class="model-card active" style="border-color:var(--accent-primary);"><div class="model-card-header"><div><div class="model-card-name" id="activeModelName">DeepSeek</div><div class="model-card-provider" id="activeModelProvider">提供商: deepseek</div><div class="model-card-desc" id="activeModelDesc" style="margin-top:4px;">deepseek-chat</div></div><div style="display:flex;align-items:center;gap:8px;"><span class="model-card-status online" id="activeModelStatus">● 在线</span><button onclick="testCurrentModel()" style="padding:4px 12px;background:var(--bg-hover);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;font-size:12px;font-family:var(--font-family);"><i class="fas fa-check"></i> 测试</button></div></div></div></div>
<div class="config-section"><div class="config-section-title"><i class="fas fa-plus-circle"></i> 添加新模型</div><div class="config-group"><label>提供商 <span style="color:var(--accent-danger);">*</span></label><select id="providerSelect" onchange="onProviderChange(this.value)"></select></div><div class="config-group"><label>模型名称 <span style="color:var(--accent-danger);">*</span></label><input type="text" id="modelNameInput" placeholder="例如: gpt-4, deepseek-chat" value="deepseek-chat" style="display:none;"><select id="modelSelect" onchange="onModelSelect(this.value)" style="display:block;"></select></div><div class="config-group"><label>API Key <span style="color:var(--accent-danger);">*</span></label><div class="input-with-action"><input type="password" id="apiKeyInput" placeholder="sk-..."><button onclick="toggleApiKeyVisibility()"><i class="fas fa-eye" id="eyeIcon"></i></button></div></div><div class="config-group"><label>API Base URL (可选)</label><input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1"></div><div style="display:flex;gap:12px;"><div class="config-group" style="flex:1;"><label>温度 (0-2)</label><input type="number" id="temperatureInput" placeholder="0.7" min="0" max="2" step="0.1" value="0.7"></div><div class="config-group" style="flex:1;"><label>最大 Token</label><input type="number" id="maxTokensInput" placeholder="2000" min="1" step="1" value="2000"></div></div><div style="display:flex;gap:12px;"><div class="config-group" style="flex:1;"><label>命中 Token 单价 ($/1M)</label><input type="number" id="priceHitInput" placeholder="0.07" min="0" step="0.001" value="0.07"></div><div class="config-group" style="flex:1;"><label>未命中 Token 单价 ($/1M)</label><input type="number" id="priceMissInput" placeholder="1.0" min="0" step="0.001" value="1.0"></div></div><div style="display:flex;gap:12px;"><div class="config-group" style="flex:1;"><label>输出 Token 单价 ($/1M)</label><input type="number" id="priceOutputInput" placeholder="2.0" min="0" step="0.001" value="2.0"></div><div class="config-group" style="flex:1;"><label>最大上下文 (Tokens)</label><input type="number" id="maxContextInput" placeholder="65536" min="1" step="1" value="65536"></div></div><div class="config-group" style="margin-bottom:12px;"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);"><input type="checkbox" id="setActiveCheckbox" checked style="width:16px;height:16px;cursor:pointer;"> 添加后设为当前使用</label></div><div style="display:flex;gap:8px;"><button class="btn-primary" onclick="addModel()"><i class="fas fa-plus"></i> 添加模型</button><button class="btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;padding:8px 16px;background:var(--bg-hover);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;font-size:13px;font-family:var(--font-family);"><i class="fas fa-times"></i> 取消编辑</button></div></div>
