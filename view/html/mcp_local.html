<!-- MCP 本地服务器面板 -->
<div class="config-section">
    <div class="config-section-title"><i class="fas fa-laptop"></i> 本地服务器</div>
    <div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-color);">
        <div class="config-section-title" style="margin-bottom:12px;"><i class="fas fa-plus-circle"></i> 添加本地 STDIO 服务器</div>
        <div style="margin-bottom:12px;">
            <label style="font-weight:600;font-size:13px;display:block;margin-bottom:6px;color:var(--text-primary);">选择本地项目目录</label>
            <select id="localServerDir" onchange="onLocalDirChange()" style="width:100%;padding:8px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;">
                <option value="">— 选择已下载的 MCP 项目 —</option>
            </select>
        </div>
        <div id="localAutoDetect" style="display:none;background:var(--bg-secondary);padding:10px 12px;border-radius:var(--radius-md);margin-bottom:12px;font-size:13px;line-height:1.8;color:var(--text-primary);">
            <div>📦 <strong id="localDetectName" style="color:var(--text-primary);">-</strong></div>
            <div>📄 描述: <span id="localDetectDesc">-</span></div>
            <div>🔧 入口: <code id="localDetectEntry" style="color:var(--accent-primary);">-</code></div>
            <div>📋 包管理器: <span id="localDetectPM" style="color:var(--text-secondary);">-</span></div>
        </div>
        <div style="border-top:1px solid var(--border-color);margin:12px 0;"></div>
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-primary);">⚙️ MCP 服务器配置 (JSON 字段对应)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div><label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">服务器 ID <span style="color:var(--accent-danger);">*</span></label><input type="text" id="localServerId" placeholder="mcpServers 的键名" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;"></div>
            <div><label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">名称 <span style="color:var(--text-muted);">(name)</span></label><input type="text" id="localServerName" placeholder="如 My MCP Server" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;"></div>
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">命令 <span style="color:var(--accent-danger);">*</span> <span style="color:var(--text-muted);font-size:11px;">(command)</span></label>
            <input type="text" id="localCommand" placeholder="如 node" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;">
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">参数 <span style="color:var(--text-muted);font-size:11px;">(args, 每行一个)</span></label>
            <textarea id="localArgs" rows="2" placeholder="dist/index.js" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;resize:vertical;font-family:monospace;"></textarea>
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">工作目录 <span style="color:var(--text-muted);font-size:11px;">(cwd)</span></label>
            <input type="text" id="localCwd" placeholder="E:\path\to\server" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;">
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">环境变量 <span style="color:var(--text-muted);font-size:11px;">(可选, env, JSON: {"KEY":"value"})</span></label>
            <textarea id="localEnv" rows="2" placeholder='{"API_KEY":"xxx"}' style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;resize:vertical;font-family:monospace;"></textarea>
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--text-secondary);">描述 <span style="color:var(--text-muted);font-size:11px;">(description)</span></label>
            <input type="text" id="localDescription" placeholder="服务器功能简介" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;">
        </div>
        <div style="margin-top:16px;display:flex;gap:10px;">
            <button onclick="addLocalMCPServer()" style="padding:8px 20px;background:var(--accent-primary);color:white;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:14px;"><i class="fas fa-plus"></i> 添加并启动</button>
            <button id="localCancelEditBtn" onclick="cancelLocalEdit()" style="display:none;padding:8px 20px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-md);cursor:pointer;font-size:14px;"><i class="fas fa-times"></i> 取消编辑</button>
            <button onclick="clearLocalForm()" style="padding:8px 20px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-md);cursor:pointer;font-size:14px;"><i class="fas fa-undo"></i> 重置</button>
        </div>
    </div>
    <div class="config-section-title" style="margin-top:0;"><i class="fas fa-list"></i> 已安装的本地服务器</div>
    <div id="mcpLocalServerList"></div>
</div>
