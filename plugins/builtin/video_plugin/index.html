<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频中心 - 学前教学视频</title>
</head>
<body>
<div class="video-center">
    <!-- 顶部工具栏 -->
    <div class="video-toolbar">
        <input type="text" id="videoSearchInput" placeholder="输入关键词搜索..."
               onkeydown="if(event.key==='Enter') window.videoApp.search()">
        <button onclick="window.videoApp.search()" title="搜索"><i class="fas fa-search"></i> 搜索</button>
        <select id="videoSubjectFilter" onchange="window.videoApp.refreshList()">
            <option value="">全部科目</option>
            <option value="数学">数学</option>
            <option value="语文">语文</option>
            <option value="英语">英语</option>
            <option value="科学">科学</option>
            <option value="艺术">艺术</option>
            <option value="健康">健康</option>
        </select>
        <select id="videoGradeFilter" onchange="window.videoApp.refreshList()">
            <option value="">全部年级</option>
            <option value="学前班">学前班</option>
            <option value="大班">大班</option>
            <option value="中班">中班</option>
            <option value="小班">小班</option>
        </select>
        <select id="videoSourceFilter" onchange="window.videoApp.refreshList()">
            <option value="">全部来源</option>
            <option value="智慧教育平台">智慧教育平台</option>
            <option value="bilibili">B站</option>
            <option value="优酷">优酷</option>
        </select>
        <button onclick="window.videoApp.refreshList()" title="刷新"><i class="fas fa-sync"></i> 刷新</button>
        <button onclick="window.video_bridge.openVideoFolder()" title="打开本地视频目录"><i class="fas fa-folder-open"></i></button>
    </div>

    <!-- 双栏布局：播放器左 + 列表右 -->
    <div class="video-layout">
        <!-- 左侧播放器 -->
        <div class="video-player-area">
            <!-- ★ 2026-08：视频+自绘控制条一体容器（position:relative，控制条 absolute 定位到底部 → 自动跟随缩放） -->
            <div class="video-player-container" id="videoPlayerContainer">
                <video id="videoPlayer" controls preload="metadata" playsinline></video>
                <!-- ★ 2026-08-13 播放启动中/缓冲等待旋转动画（开始播放后隐藏） -->
                <div id="videoSpinner" class="video-spinner" style="display:none;"></div>
            </div>
            <div class="video-now-playing">
                <div class="video-now-header">
                    <div class="video-now-title" id="videoNowTitle">请选择视频播放</div>
                    <!-- ★ 2026-08-15 上一个/下一个主动切换按钮：与标题同行靠右、紧凑显示（未播完也可点击；无上一项/下一项时由 updateNavButtons 置灰） -->
                    <div class="video-now-nav">
                        <button type="button" class="video-nav-btn" id="videoPrevBtn"
                                onclick="window.videoApp.playPrev()" disabled
                                title="播放列表中的上一个（系列内按集序优先）">
                            <i class="fas fa-step-backward"></i> 上一个
                        </button>
                        <button type="button" class="video-nav-btn video-nav-btn-primary" id="videoNextBtn"
                                onclick="window.videoApp.playNext()" disabled
                                title="播放下一个（系列内按集序优先；播放结束自动连播）">
                            下一个 <i class="fas fa-step-forward"></i>
                        </button>
                    </div>
                </div>
                <div class="video-now-meta" id="videoNowMeta"></div>
                <div class="video-now-progress" id="videoNowProgress">00:00 / 00:00</div>
                <div class="video-now-actions">
                    <a href="javascript:void(0)" id="videoSourceLink"
                       onclick="window.videoApp.openSourceLink()" style="display:none;">
                        <i class="fas fa-external-link-alt"></i> 打开源链接
                    </a>
                </div>
            </div>
        </div>

        <!-- 右侧播放列表（★ 2026-08-14 在普通列表基础上加全屏展开：头部「全屏」按钮 → 覆盖全窗口多列网格） -->
        <div class="video-list-area">
            <div class="video-list-header">
                <span><i class="fas fa-list"></i> 播放列表</span>
                <span class="video-list-header-right">
                    <span id="videoCount" class="video-count">0 个视频</span>
                    <button class="video-list-toggle" title="全屏展开列表" onclick="window.videoApp.openFullscreen()">
                        <i class="fas fa-expand"></i>
                    </button>
                </span>
            </div>
            <div class="video-list" id="videoList">
                <div class="video-empty">🎬 暂无视频<br>请让 AI 搜索教学视频</div>
            </div>
        </div>

        <!-- ★ 2026-08-14 全屏展开列表（absolute 铺满 .video-layout：只盖住播放区+列表区，不占顶部工具栏；多列网格，缩略图原尺寸不变） -->
        <div class="video-list-fullscreen" id="videoListFullscreen" style="display:none;">
            <div class="video-list-fullscreen-header">
                <span><i class="fas fa-list"></i> 播放列表</span>
                <span id="fullscreenVideoCount" class="video-count">0 个视频</span>
                <button class="video-list-toggle" title="收起全屏列表" onclick="window.videoApp.closeFullscreen()">
                    <i class="fas fa-compress"></i>
                </button>
            </div>
            <div class="video-list-fullscreen-body">
                <!-- ★ 2026-08-14 展开列表改为三级嵌套分组容器：去掉 video-grid，分组网格下移到 .video-cat-grid -->
                <div id="fullscreenVideoList"></div>
            </div>
        </div>
    </div>
</div>
<!-- 认证信息输入模态框 -->
<div id="videoAuthModal" class="auth-modal-overlay" style="display:none;">
    <div class="auth-modal">
        <h3>🔐 该网站需要认证</h3>
        <p class="auth-site" id="authSiteName"></p>
        <p class="auth-hint">请从浏览器开发者工具（F12 → Network → 请求头）复制 Cookie 或 Token 粘贴到下面：</p>
        <textarea id="authInput" rows="4" placeholder="例如：SUS=SID=xxx; SUV=yyy"></textarea>
        <div class="auth-actions">
            <button onclick="window.videoApp.confirmAuth()" class="auth-btn-primary">💾 保存并重试</button>
            <button onclick="window.videoApp.closeAuth()" class="auth-btn-secondary">✖ 取消</button>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div id="videoConfirmModal" class="auth-modal-overlay" style="display:none;">
    <div class="auth-modal">
        <h3>🗑️ 删除视频</h3>
        <p class="auth-site" id="confirmVideoTitle"></p>
        <p class="auth-hint">确定删除该视频？删除后本地文件与数据库记录将一并移除。</p>
        <div class="auth-actions">
            <button onclick="window.videoApp.confirmDelete()" class="auth-btn-danger">🗑️ 确认删除</button>
            <button onclick="window.videoApp.cancelDelete()" class="auth-btn-secondary">✖ 取消</button>
        </div>
    </div>
</div>

</body>
</html>
